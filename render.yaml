services:
  - type: web
    name: avaliador-podcast
    runtime: docker
    repo: https://github.com/rgbittencourt/avaliador-p4-podcast
    branch: main
    region: ohio
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        value: professor
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
